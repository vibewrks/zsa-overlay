[package]
name = "moonlander-keyboard-state"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Reports the Moonlander's active layer and pressed keys from the Oryx raw HID interface as JSON lines"
publish = false

[[bin]]
name = "moonlander-keyboard-state"
path = "src/main.rs"

[dependencies]
ctrlc = { version = "3", features = ["termination"] }
hidapi = "2.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
